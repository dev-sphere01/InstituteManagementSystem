name: Build and Publish Docker Images

'on':
  push:
    branches:
      - main
    paths:
      - 'IMS_FRONTEND/**'
      - 'IMS_BACKEND/**'
      - 'EMS/**'
      - 'deployment/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: dev-sphere01/institutemanagementsystem

jobs:
  # ==========================================
  # 1. IMS Frontend (React SPA / Nginx)
  # ==========================================
  build-ims-frontend:
    name: Build & Push IMS Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push IMS Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./IMS_FRONTEND
          file: ./IMS_FRONTEND/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ims-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ims-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_IMS_API_BASE_URL || '/api/v1' }}
            VITE_CUPLEMS_URL=${{ vars.VITE_EMS_API_BASE_URL || 'https://ems.prodevsphere.in' }}
            VITE_API_BASE_URL_LIVE=${{ vars.VITE_IMS_API_BASE_URL_LIVE || '/api/v1' }}
            VITE_BACKEND_BASE_URL=${{ vars.VITE_IMS_BACKEND_BASE_URL || '' }}
            VITE_API_TIMEOUT=30000
            VITE_APP_STAGE=production
          cache-from: type=gha,scope=ims-frontend
          cache-to: type=gha,mode=max,scope=ims-frontend

  # ==========================================
  # 2. IMS Backend (Node.js / Express API)
  # ==========================================
  build-ims-backend:
    name: Build & Push IMS Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push IMS Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./IMS_BACKEND
          file: ./IMS_BACKEND/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ims-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ims-backend:${{ github.sha }}
          cache-from: type=gha,scope=ims-backend
          cache-to: type=gha,mode=max,scope=ims-backend

  # ==========================================
  # 3. EMS API (ASP.NET Core 8 Web API)
  # ==========================================
  build-ems-api:
    name: Build & Push EMS API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push EMS API image
        uses: docker/build-push-action@v6
        with:
          context: ./EMS/api/EMS
          file: ./EMS/api/EMS/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ems-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ems-api:${{ github.sha }}
          cache-from: type=gha,scope=ems-api
          cache-to: type=gha,mode=max,scope=ems-api

  # ==========================================
  # 4. EMS Node API (Socket.io Notification Service)
  # ==========================================
  build-ems-nodeapi:
    name: Build & Push EMS Node API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push EMS Node API image
        uses: docker/build-push-action@v6
        with:
          context: ./EMS/nodeapi
          file: ./EMS/nodeapi/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ems-nodeapi:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ems-nodeapi:${{ github.sha }}
          cache-from: type=gha,scope=ems-nodeapi
          cache-to: type=gha,mode=max,scope=ems-nodeapi

  # ==========================================
  # 5. EMS UI (React SPA / Nginx)
  # ==========================================
  build-ems-ui:
    name: Build & Push EMS UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push EMS UI image
        uses: docker/build-push-action@v6
        with:
          context: ./EMS/ui
          file: ./EMS/ui/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ems-ui:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ems-ui:${{ github.sha }}
          build-args: |
            VITE_APP_STAGE=production
            VITE_API_BASE_URL_LIVE=${{ vars.VITE_EMS_API_BASE_URL || 'https://ems.prodevsphere.in/api' }}
            VITE_APP_VERSION=1.0.0
          cache-from: type=gha,scope=ems-ui
          cache-to: type=gha,mode=max,scope=ems-ui
